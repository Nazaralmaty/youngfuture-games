<script>
/* 1English quiz: «18 жасқа дейін» / «50 жастан жоғары» closes the page; nothing is sent, no Pixel Lead.
   Same block works on the Tilda page (T123) once the age question is added there with these exact answers. */
(function () {
  var STOP = ['18 жасқа дейін', '50 жастан жоғары'];
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.type !== 'radio' || STOP.indexOf(t.value.trim()) < 0) return;
    e.stopImmediatePropagation();                                   // the quiz must not move on
    window.close();                                                 // works only where the browser allows it
    setTimeout(function () { location.replace('about:blank'); }, 150);  // otherwise: blank page, Back can't return
  }, true);
})();
</script>
<!-- ===== TILDA END ===== -->
