<style>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  #wrap{position:relative;width:100%;max-width:460px;height:100svh;max-height:920px;overflow:hidden;
        background:#0a1330;user-select:none;box-shadow:0 0 80px rgba(0,0,0,.6)}
  canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;z-index:1}

  #hud{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:7px;
       padding:calc(9px + env(safe-area-inset-top)) 11px 9px;
       background:linear-gradient(180deg,rgba(7,11,30,.55),rgba(7,11,30,0))}
  .pill{display:inline-flex;align-items:center;gap:5px;background:rgba(11,19,48,.6);border:1px solid rgba(255,255,255,.24);
        border-radius:999px;padding:6px 12px;font-size:13px;font-weight:900;color:#fff;
        backdrop-filter:blur(6px);white-space:nowrap}
  #hudRight{margin-left:auto;display:flex;gap:7px}
  .ibtn{background:rgba(11,19,48,.6);border:1px solid rgba(255,255,255,.24);color:#fff;border-radius:12px;
        width:36px;height:36px;cursor:pointer;font-size:15px;backdrop-filter:blur(6px);flex:none}
  .ibtn:active{transform:scale(.93)}

  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:900;color:#0b1330;width:100%;
       background:linear-gradient(180deg,#b9f18c,#7fce4c);border-radius:16px;padding:16px 20px;font-size:18px;
       box-shadow:0 6px 0 #4d8f2b,0 12px 26px rgba(0,0,0,.35);letter-spacing:.2px}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #4d8f2b}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none}
  .btn.ghost:active{transform:translateY(2px);box-shadow:none}
  .btn.sm{font-size:15px;padding:13px 16px}

  .screen{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;
          padding:26px 22px;background:rgba(7,11,30,.78);backdrop-filter:blur(7px)}
  .screen.on{display:flex}
  .card{width:100%;max-width:340px;background:linear-gradient(170deg,#1c2456,#111838);
        border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:24px 22px 20px;text-align:center;
        box-shadow:0 26px 60px rgba(0,0,0,.55);animation:pop .34s cubic-bezier(.2,1.4,.5,1)}
  @keyframes pop{0%{transform:scale(.82) translateY(14px);opacity:0}100%{transform:none;opacity:1}}
  .card h2{font-size:25px;font-weight:900;letter-spacing:-.4px}
  .card p{font-size:14px;color:#c7cdf0;margin-top:8px;line-height:1.55}
  .stars{display:flex;justify-content:center;gap:10px;margin:16px 0 6px;font-size:40px;line-height:1}
  .stars span{filter:grayscale(1) brightness(.6);transform:scale(.72);transition:.36s cubic-bezier(.2,1.5,.4,1)}
  .stars span.on{filter:none;transform:scale(1)}
  .row{display:flex;gap:9px;margin-top:16px}
  .row .btn{flex:1}
  .stat{display:flex;justify-content:center;gap:20px;margin-top:12px;font-size:12.5px;color:#9aa3d0;font-weight:800}
  .stat b{display:block;font-size:19px;color:#fff;margin-top:2px}
  .hint{font-size:12px;color:#8f97c4;margin-top:14px;line-height:1.5}
  .learned{margin-top:12px;max-height:24vh;overflow:auto}
  .chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);
        border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 10px;margin:3px;font-size:12.5px}
  .chip b{color:var(--lime)}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   StudyLine · Ағылшын аренасы (flappy_english)
   ---------------------------------------------------------------------------
   ТЗ: studyline/games/АРЕНА_2.0_ТЗ_RU.md, раздел 2.

   Что взято из games/flappy-mr1nbd272vmh0.html: мотор полёта и процедурный
   Web Audio — работающая, проверенная часть, переписывать её заново незачем.
   Что изменено:
     • нет экрана регистрации и CTA «СТАРТ на номер» — это воронка 1English,
       у неё своя метрика (лиды), и она остаётся жить в games/ отдельно;
     • словарь не офисный (working/calling/meeting), а программа 5–6 класса;
     • вместо ручного выбора Оңай/Орташа/Қиын — 17 тапсырм карты арены:
       сложность и слова растут сами, как в sort_arena и nature_flow;
     • подключён бридж StudyLine (SL.init/ready/progress/finish).

   Ноль внешних файлов: звук синтезируется, графика рисуется кодом.
   ═══════════════════════════════════════════════════════════════════════════ */

var AK=window.ArenaKit;
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ═════════════ 1. ЗВУК — из оригинала, без переписывания ═════════════ */
var Sound=(function(){
  var ACtx=window.AudioContext||window.webkitAudioContext;
  var ctx=null,master,musicG,sfxG,noiseBuf=null;
  var enabled=true,playing=false,timer=null,step=0,nextT=0,stepDur=0.22;
  function ensure(){ if(ctx||!ACtx)return;
    ctx=new ACtx();
    master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);
    musicG=ctx.createGain();musicG.gain.value=0.0001;musicG.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=0.78;sfxG.connect(master);
    var n=Math.floor(ctx.sampleRate*0.4);noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);
    var d=noiseBuf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  function T(){return ctx?ctx.currentTime:0;}
  function tone(f,t0,dur,type,peak,dest){ if(!ctx)return;
    var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(dest||sfxG);o.start(t0);o.stop(t0+dur+0.03);}
  function sweep(f0,f1,t0,dur,type,peak){ if(!ctx)return;
    var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(sfxG);o.start(t0);o.stop(t0+dur+0.03);}
  function noise(t0,dur,peak,hp){ if(!ctx)return;
    var s=ctx.createBufferSource();s.buffer=noiseBuf;
    var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp||2000;
    var g=ctx.createGain();g.gain.setValueAtTime(peak,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(sfxG);s.start(t0);s.stop(t0+dur+0.03);}
  function kick(t0){ if(!ctx)return;
    var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(150,t0);o.frequency.exponentialRampToValueAtTime(48,t0+0.12);
    g.gain.setValueAtTime(0.3,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.14);
    o.connect(g);g.connect(musicG);o.start(t0);o.stop(t0+0.16);}
  function hat(t0){ if(!ctx)return;
    var s=ctx.createBufferSource();s.buffer=noiseBuf;
    var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=8000;
    var g=ctx.createGain();g.gain.setValueAtTime(0.05,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.04);
    s.connect(f);f.connect(g);g.connect(musicG);s.start(t0);s.stop(t0+0.05);}
  var SCALE=[523.25,587.33,659.25,783.99,880.0,1046.5];
  var MEL=[0,2,4,5,4,2,3,1,0,2,3,4,2,1,0,-1];
  var BASS=[130.81,196.0,220.0,174.61];
  function stepPlay(i,t){ var m=MEL[i];
    if(m>=0)tone(SCALE[m],t,stepDur*0.85,'square',0.10,musicG);
    if(i%4===0){tone(BASS[(i/4)%4],t,stepDur*3.2,'triangle',0.16,musicG);kick(t);}
    if(i%2===1)hat(t);}
  function sched(){ if(!playing||!ctx)return;
    while(nextT<ctx.currentTime+0.12){stepPlay(step,nextT);nextT+=stepDur;step=(step+1)%16;}
    timer=setTimeout(sched,25);}
  function go(fn){ if(!enabled)return;ensure();if(!ctx)return;
    if(ctx.state==='suspended')ctx.resume();fn(T());}

  var __sEl=null,__SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
  function iosUnlock(){
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    if(!__sEl){ try{ __sEl=document.createElement('audio');__sEl.setAttribute('playsinline','');
      __sEl.loop=true;__sEl.volume=0.02;__sEl.src=__SILENT; }catch(e){} }
    if(__sEl){ try{ var p=__sEl.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} }
  }
  return {
    unlock:function(){ensure();if(ctx&&ctx.state==='suspended')ctx.resume();iosUnlock();},
    startMusic:function(bpm){ensure();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();if(playing)return;
      stepDur=60/(bpm||122)/2;step=0;nextT=ctx.currentTime+0.1;playing=true;
      musicG.gain.cancelScheduledValues(ctx.currentTime);musicG.gain.setValueAtTime(0.0001,ctx.currentTime);
      musicG.gain.exponentialRampToValueAtTime(enabled?0.18:0.0001,ctx.currentTime+0.6);sched();},
    stopMusic:function(){playing=false;if(timer)clearTimeout(timer);
      if(ctx)try{musicG.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.3);}catch(e){}},
    correct:function(){go(function(t){[659.25,830.6,987.77].forEach(function(f,i){
      tone(f,t+i*0.045,0.16,'triangle',0.30);});});},
    jump:function(){go(function(t){sweep(280,720,t,0.15,'square',0.24);});},
    hit:function(){go(function(t){sweep(200,55,t,0.3,'sawtooth',0.4);noise(t,0.16,0.22,500);});},
    combo:function(n){go(function(t){var f=520+Math.min(n,14)*55;
      tone(f,t,0.10,'square',0.26);tone(f*1.5,t+0.04,0.10,'square',0.2);});},
    click:function(){go(function(t){tone(900,t,0.05,'square',0.22);noise(t,0.02,0.05,5000);});},
    nope:function(){go(function(t){sweep(300,190,t,0.16,'sine',0.18);noise(t,0.05,0.05,900);});},
    win:function(){go(function(t){[523,659,784,1046,1318].forEach(function(f,i){
      tone(f,t+i*0.085,0.22,'triangle',0.28);});});},
    star:function(i){go(function(t){tone([784,988,1319][i]||1319,t,0.24,'triangle',0.26);});},
    over:function(){go(function(t){[660,560,440,330].forEach(function(f,i){
      tone(f,t+i*0.12,0.2,'triangle',0.26);});});},
    unlock2:function(){go(function(t){sweep(400,1200,t,0.32,'triangle',0.22);
      tone(1568,t+0.3,0.2,'triangle',0.2);});},
    setEnabled:function(v){enabled=v;ensure();if(ctx){sfxG.gain.value=v?0.78:0.0;
      if(playing)try{musicG.gain.exponentialRampToValueAtTime(v?0.18:0.0001,ctx.currentTime+0.1);}catch(e){}}},
    toggle:function(){this.setEnabled(!enabled);return enabled;}
  };
})();

/* ═════════════ 2. СЛОВАРЬ — программа 5–6 класса ═════════════
   Контент — ДАННЫЕ, не код (то же правило, что в sort_arena и nature_flow).
   Черновик под 5–6 сынып, финальную редакцию даёт контент-команда.

   `g` — смысловая группа. Из неё берётся отвлекающий вариант: «мысық» против

var WORDS=[
  /* ── tier 1: короткие частотные ── */

/* ═════════════ 3. КРИВАЯ БИОМА ═════════════
   17 тапсырм = 1 биом, как у sort_arena и nature_flow. Игрок не выбирает
   «Оңай/Орташа/Қиын» — сложность и слова растут по карте сами. */
var NODES=17;
function levelCfg(n){
  n=clamp(n,1,NODES);
  /* Пик ФИЗИЧЕСКОЙ сложности — тапсырмы 13–14, а не 15–17. Тот же урок, что
     в sort_arena: максимум реакции плюс максимум учебной нагрузки
     одновременно — это не вызов, а стена. На 15–17 в проёмах уже
     словосочетания в две строки, их надо успеть прочитать, поэтому стены
     там идут реже и проём шире (проверено автопрогоном: при кривой «всё
     растёт до конца» блок словосочетаний физически непроходим). */
  if(n>=15){
    var k=n-15;
    return { tier:3, goal:8, lives:3,
             spd:0.290+k*0.008, every:2.70-k*0.10, gap:0.235-k*0.005,
             grav:1.72+k*0.020, flap:0.575+k*0.004 };
  }
  return {
    tier:  n<=6?1:2,
    goal:  n<=6?6:8,                      /* сколько проёмов надо взять верно */
    lives: 3,
    spd:   0.24+(n-1)*0.010,
    every: Math.max(1.9, 3.00-(n-1)*0.07),
    gap:   Math.max(0.185, 0.270-(n-1)*0.005),
    grav:  1.55+(n-1)*0.024,
    flap:  0.55+(n-1)*0.004
  };
}

/* Слова тапсырмы: сид фиксирован номером, «переиграть» = те же слова,
   а не новая случайная выборка (тот же принцип, что у раскладок). */
function wordsFor(n){
  var cfg=levelCfg(n), rnd=AK.rng(n*104729+17);
  var pool=WORDS.filter(function(w){ return w.tier===cfg.tier; });
  var pick=AK.shuffle(pool.slice(),rnd).slice(0,cfg.goal+3);
  return pick.map(function(w){
    /* отвлекающий — из той же смысловой группы, иначе выбор очевиден */
    var same=pool.filter(function(x){ return x.g===w.g&&x.kk!==w.kk; });
    var alt=(same.length?same:pool.filter(function(x){ return x.kk!==w.kk; }));
    var wrong=alt[Math.floor(rnd()*alt.length)];
    return { en:w.en, kk:w.kk, g:w.g, wrong:wrong.kk, up:rnd()<0.5 };
  });
}

/* ═════════════ 4. ПРОГРЕСС ═════════════ */
var Save=AK.save('sl_flappy_english_v1',NODES).load();

/* ═════════════ 5. ИГРА ═════════════ */
var Game=(function(){
  var wrap=document.getElementById('wrap'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1;
  var TTS=('speechSynthesis' in window);
  function speak(t){ if(!TTS)return;
    try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t);
         u.lang='en-US'; u.rate=0.9; speechSynthesis.speak(u); }catch(e){} }

  var state='map', level=1, cfg=null, deck=[], deckI=0;
  var birdX,birdR,GRAV,FLAP,speed,obW,gapH,upC,lowC,bannerH;
  var bird,obs=[],spawnT=0,ok=0,miss=0,combo=0,maxCombo=0,lives=3;
  var learned=[],missed=[],missTopics={},startedAt=0;
  var flash=0,invuln=0,shake=0,scroll=0,parts=[],pops=[],last=0;
  var session={nodes:0,ok:0,miss:0,stars:0};
  var Map=null,Drill=null;

  function $(id){ return document.getElementById(id); }

  function setupGeom(){
    birdX=W*0.30; birdR=Math.max(13,H*0.024);
    /* плашка обязана вместить HUD-пилюли (≈56 px) + слово + строку прогресса:
       на 844 px это 143 px, иначе слово наезжает на кнопки */
    obW=W*0.19; bannerH=Math.max(H*0.17,116); upC=H*0.40; lowC=H*0.72;
    if(cfg){ GRAV=cfg.grav*H; FLAP=-cfg.flap*H; speed=cfg.spd*W; gapH=cfg.gap*H; }
  }
  function resize(){
    var r=wrap.getBoundingClientRect(); W=r.width; H=r.height;
    DPR=Math.min(2.5,window.devicePixelRatio||1);
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    setupGeom();
  }
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){ setTimeout(resize,120); });

  function burst(x,y,col,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*6.283, sp=Math.random()*H*0.28+H*0.05;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.6,col:col});
    }
  }
  function pop(t,x,y,col){ pops.push({t:t,x:x,y:y,a:1,s:0,col:col||'#9be870'}); }

  /* ── тапсырма ──────────────────────────────────────────────────────── */
  function start(n){
    level=n; cfg=levelCfg(n); deck=wordsFor(n); deckI=0;
    resize();
    bird={y:H*0.45,vy:0,rot:0}; obs=[]; spawnT=0.9;
    ok=0; miss=0; combo=0; maxCombo=0; lives=cfg.lives;
    learned=[]; missed=[]; startedAt=Date.now();
    flash=0; invuln=0; shake=0; scroll=0; parts=[]; pops=[];
    state='ready';
    Map.hide();
    $('pTitle').textContent=n+'-тапсырма';
    Sound.unlock(); Sound.startMusic(124);
  }
  function openMap(){
    state='map'; Sound.stopMusic();
    $('pTitle').textContent='Ағылшын аренасы';
    Map.show();
  }

  function spawn(){
    var w=deck[deckI%deck.length]; deckI++;
    obs.push({ x:W+obW, w:w,
               optUp:  w.up?w.kk:w.wrong,
               optDown:w.up?w.wrong:w.kk,
               correct:w.up?'up':'down', scored:false, crashed:false });
  }
  function flap(){
    if(state==='ready'){ state='play'; }
    if(state==='play'){ bird.vy=FLAP; Sound.jump(); }
  }
  cv.addEventListener('pointerdown',function(e){ e.preventDefault(); Sound.unlock(); flap(); },{passive:false});
  window.addEventListener('keydown',function(e){ if(e.code==='Space'){ e.preventDefault(); flap(); } });

  function hurt(word){
    if(invuln>0) return;
    lives--; combo=0; flash=1; invuln=0.9; shake=1; miss++;
    Sound.hit();
    if(word){
      missed.push(word);
      missTopics[word.g]=(missTopics[word.g]||0)+1;
      pop(word.en+' = '+word.kk, W/2, H*0.32, '#ff4d6d');
    }
    if(lives<=0) lose();
  }

  function circleRect(cx,cy,r,rx,ry,rw,rh){
    var nx=Math.max(rx,Math.min(cx,rx+rw)), ny=Math.max(ry,Math.min(cy,ry+rh));
    var dx=cx-nx, dy=cy-ny; return dx*dx+dy*dy<r*r;
  }
  function hitsWalls(o){
    if(birdX+birdR<o.x||birdX-birdR>o.x+obW) return false;
    var upT=upC-gapH/2,upB=upC+gapH/2,lowT=lowC-gapH/2,lowB=lowC+gapH/2;
    return circleRect(birdX,bird.y,birdR,o.x,bannerH,obW,upT-bannerH)
        || circleRect(birdX,bird.y,birdR,o.x,upB,obW,lowT-upB)
        || circleRect(birdX,bird.y,birdR,o.x,lowB,obW,H-lowB);
  }

  function update(dt){
    var p,q,k,o;
    for(p=parts.length-1;p>=0;p--){ q=parts[p];
      q.vy+=H*1.4*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt;
      if(q.life<=0) parts.splice(p,1); }
    for(k=pops.length-1;k>=0;k--){ o=pops[k];
      o.y-=dt*H*0.10; o.a-=dt*0.9; o.s=Math.min(1,o.s+dt*6);
      if(o.a<=0) pops.splice(k,1); }
    if(shake>0) shake=Math.max(0,shake-dt*3.2);
    if(flash>0) flash=Math.max(0,flash-dt*2.4);
    if(state!=='play') return;

    bird.vy+=GRAV*dt; bird.y+=bird.vy*dt;
    bird.rot=clamp(bird.vy/(H*1.1),-0.5,1.1);
    if(bird.y<bannerH+birdR){ bird.y=bannerH+birdR; bird.vy=0; }
    if(bird.y>H-birdR){ bird.y=H-birdR; bird.vy=0; }
    if(invuln>0) invuln-=dt;
    scroll=(scroll-speed*dt)%40;

    spawnT-=dt;
    if(spawnT<=0){ spawn(); spawnT=cfg.every; }

    for(var i=0;i<obs.length;i++){
      o=obs[i]; o.x-=speed*dt;
      if(o.scored||o.crashed) continue;
      if(hitsWalls(o)){ hurt(null); o.crashed=true; continue; }
      if(o.x+obW<birdX){
        o.scored=true;
        var band=(Math.abs(bird.y-upC)<=gapH/2)?'up':(Math.abs(bird.y-lowC)<=gapH/2)?'down':'wall';
        if(band===o.correct){
          ok++; combo++; maxCombo=Math.max(maxCombo,combo);
          learned.push(o.w); speak(o.w.en);
          Sound.correct(); if(combo>=3) Sound.combo(combo);
          burst(birdX,bird.y,'#9be870',10);
          pop('+1',birdX,bird.y-birdR*2,'#9be870');
          if(ok>=cfg.goal){ win(); return; }
        } else hurt(o.w);
      }
    }
    obs=obs.filter(function(x){ return x.x>-obW-W*0.1; });
  }

  /* ── итог ──────────────────────────────────────────────────────────── */
  function win(){
    state='win'; Sound.stopMusic(); Sound.win();
    var stars=miss===0?3:(miss<=2?2:1);
    var prev=Save.starsOf(level);
    Save.complete(level,stars);
    var newDay=Save.markToday();
    session.nodes++; session.ok+=ok; session.miss+=miss;
    session.stars+=Math.max(0,stars-prev);

    try{
      SL.progress({ level:level, stars:stars, correct:ok, mistakes:miss,
                    maxCombo:maxCombo, tier:cfg.tier, goal:cfg.goal,
                    durationSec:Math.round((Date.now()-startedAt)/1000),
                    words:learned.map(function(w){ return w.en; }),
                    errors:missed.map(function(w){ return {word:w.en,kk:w.kk,topic:w.g}; }) });
    }catch(e){}

    $('winTitle').textContent=stars===3?'Мінсіз!':'Жарайсың!';
    $('winSub').textContent=stars===3?'Бірде-бір қате жоқ.':'Тапсырма орындалды.';
    $('wOk').textContent=ok; $('wErr').textContent=miss; $('wCombo').textContent=maxCombo;
    $('wLearn').innerHTML=chips(learned);
    $('nextBtn').textContent=level>=NODES?'Аяқтау':'Келесі';
    $('winHint').textContent=newDay
      ? ('Осы аптада '+Save.daysThisWeek()+' күн ойнадың 🔥')
      : (stars===3?'':'3 жұлдыз: қатесіз өт.');
    ['st1','st2','st3'].forEach(function(id){ $(id).classList.remove('on'); });
    $('sWin').classList.add('on');
    for(var s=0;s<stars;s++)(function(s){
      setTimeout(function(){ $(['st1','st2','st3'][s]).classList.add('on'); Sound.star(s); },320+s*300);
    })(s);
  }
  function lose(){
    state='over'; Sound.stopMusic(); Sound.over();
    $('loseSub').textContent='Жүрек бітті. '+ok+' / '+cfg.goal+' сөз дұрыс болды — қайталап көр.';
    $('lLearn').innerHTML=chips(missed,true);
    $('sLose').classList.add('on');
  }
  function chips(list,red){
    var uniq=[], seen={};
    list.forEach(function(w){ if(!seen[w.en]){ seen[w.en]=1; uniq.push(w); } });
    if(!uniq.length) return '';
    return uniq.map(function(w){
      return '<span class="chip">'+w.en+' — <b'+(red?' style="color:#ff9db1"':'')+'>'+w.kk+'</b></span>';
    }).join('');
  }

  /* ── рисование ─────────────────────────────────────────────────────── */
  function rr(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function heart(cx,cy,s,color){
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(cx-s*0.5,cy-s*0.25,s*0.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+s*0.5,cy-s*0.25,s*0.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx-s,cy); ctx.lineTo(cx+s,cy); ctx.lineTo(cx,cy+s*1.1);
    ctx.closePath(); ctx.fill();
  }
  /* Подпись в проёме: словосочетания 15–17 тапсырм длиннее клетки,
     поэтому шрифт ужимается и текст переносится на две строки. */
  function drawLabel(txt,cx,cy){
    var maxW=obW*1.7, size=Math.round(H*0.026), lines=[txt];
    ctx.font='900 '+size+'px Inter,Arial';
    if(ctx.measureText(txt).width>maxW){
      var sp=txt.lastIndexOf(' ');
      if(sp>0) lines=[txt.slice(0,sp),txt.slice(sp+1)];
    }
    while(size>9){
      ctx.font='900 '+size+'px Inter,Arial';
      var wMax=Math.max.apply(null,lines.map(function(l){ return ctx.measureText(l).width; }));
      if(wMax<=maxW) break;
      size--;
    }
    ctx.font='900 '+size+'px Inter,Arial';
    var bw=Math.max.apply(null,lines.map(function(l){ return ctx.measureText(l).width; }))+H*0.03;
    var lh=size*1.15, bh=lh*lines.length+H*0.022;
    ctx.fillStyle='#9be870'; rr(cx-bw/2,cy-bh/2,bw,bh,bh/2); ctx.fill();
    ctx.fillStyle='#0b1330'; ctx.textAlign='center'; ctx.textBaseline='middle';
    lines.forEach(function(l,i){ ctx.fillText(l,cx,cy+(i-(lines.length-1)/2)*lh); });
  }
  function draw(){
    /* на карте канвас целиком закрыт DOM-оверлеем — кадр рисовать незачем */
    if(state==='map') return;
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.globalAlpha=1; ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0) ctx.translate((Math.random()-0.5)*shake*H*0.022,(Math.random()-0.5)*shake*H*0.022);

    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#22326f'); g.addColorStop(0.6,'#131e47'); g.addColorStop(1,'#0a1330');
    ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.fillStyle='rgba(255,255,255,.10)';
    for(var s2=0;s2<16;s2++) ctx.fillRect((s2*61+scroll*0.3+W)%W,(s2*43)%(H*0.7)+10,2,2);

    if(state==='play'||state==='ready'||state==='win'||state==='over'){
      var upT=upC-gapH/2,upB=upC+gapH/2,lowT=lowC-gapH/2,lowB=lowC+gapH/2;
      for(var k=0;k<obs.length;k++){
        var o=obs[k];
        var grd=ctx.createLinearGradient(o.x,0,o.x+obW,0);
        grd.addColorStop(0,o.crashed?'#7a3a6a':'#5a47e0');
        grd.addColorStop(1,o.crashed?'#5a2a4f':'#3a2bbf');
        ctx.fillStyle=grd;
        rr(o.x,bannerH,obW,upT-bannerH,9); ctx.fill();
        rr(o.x,upB,obW,lowT-upB,9); ctx.fill();
        rr(o.x,lowB,obW,H-lowB,9); ctx.fill();
        drawLabel(o.optUp,o.x+obW/2,upC);
        drawLabel(o.optDown,o.x+obW/2,lowC);
      }
      /* верхняя плашка: какое слово переводим прямо сейчас */
      var nxt=null;
      for(var n2=0;n2<obs.length;n2++) if(obs[n2].x+obW>birdX){ nxt=obs[n2]; break; }
      ctx.fillStyle='rgba(7,11,30,.72)'; ctx.fillRect(0,0,W,bannerH);
      if(nxt){
        /* «take a photo» длиннее «cat» втрое — шрифт ужимается под ширину,
           иначе слово уезжает под кнопки HUD */
        var txt=nxt.w.en+'  = ?', fs=Math.round(H*0.040);
        for(;fs>15;fs--){ ctx.font='900 '+fs+'px Inter,Arial';
          if(ctx.measureText(txt).width<=W-36) break; }
        ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(txt,W/2,bannerH*0.63);
      }

      ctx.save(); ctx.translate(birdX,bird?bird.y:H*0.45); ctx.rotate(bird?bird.rot:0);
      if(!(invuln>0&&Math.floor(invuln*14)%2===0)){
        ctx.fillStyle='rgba(255,206,74,.25)';
        ctx.beginPath(); ctx.arc(0,0,birdR*1.6,0,7); ctx.fill();
        ctx.font=Math.round(birdR*2.3)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🐤',0,0);
      }
      ctx.restore();

      for(var pp=0;pp<parts.length;pp++){
        var q=parts[pp]; ctx.globalAlpha=Math.max(0,q.life/0.6);
        ctx.fillStyle=q.col; ctx.fillRect(q.x,q.y,H*0.012,H*0.012);
      }
      ctx.globalAlpha=1;
      for(var pk=0;pk<pops.length;pk++){
        var op=pops[pk]; ctx.globalAlpha=Math.max(0,op.a);
        ctx.fillStyle=op.col; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font='900 '+Math.round(H*0.026*op.s)+'px Inter,Arial';
        ctx.fillText(op.t,op.x,op.y);
      }
      ctx.globalAlpha=1;
    }
    ctx.restore();

    if(state==='play'||state==='ready'||state==='win'||state==='over'){
      /* прогресс тапсырмы вместо бесконечного счёта: у узла арены есть край */
      /* номер тапсырмы уже есть в HUD-пилюле — на канвасе он был дублем */
      var rowY=bannerH-H*0.022;
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillStyle='#fff'; ctx.font='900 '+Math.round(H*0.026)+'px Inter,Arial';
      ctx.fillText('✅ '+ok+' / '+cfg.goal,14,rowY);
      var s=H*0.014, gap=s*2.7;
      for(var i=0;i<3;i++) heart(W-14-s-i*gap,rowY,s,i<lives?'#ff4d6d':'rgba(255,255,255,.18)');
      if(combo>=3){
        ctx.textAlign='left'; ctx.fillStyle='#ffce4a'; ctx.font='800 '+Math.round(H*0.022)+'px Inter,Arial';
        ctx.fillText('🔥 x'+combo,14,bannerH+H*0.032);
      }
    }
    if(state==='ready'){
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgba(255,255,255,.92)'; ctx.font='900 '+Math.round(H*0.030)+'px Inter,Arial';
      ctx.fillText('Экранды бас — ұш 👆',W/2,H*0.52);
      ctx.fillStyle='#9be870'; ctx.font='800 '+Math.round(H*0.021)+'px Inter,Arial';
      ctx.fillText('Дұрыс аудармасы бар саңылауға ұш',W/2,H*0.58);
    }
    if(flash>0){ ctx.fillStyle='rgba(255,77,109,'+(flash*0.26)+')'; ctx.fillRect(0,0,W,H); }
  }

  function loop(now){
    var dt=Math.min(0.05,(now-(last||now))/1000); last=now;
    try{ update(dt); draw(); }catch(e){ if(window.console)console.error(e); }
    requestAnimationFrame(loop);
  }

  return {
    boot:function(m,d){
      Map=m; Drill=d; cfg=levelCfg(1); resize();
      var q=(location.search||'').match(/[?&]level=(\d+)/);
      var lv=q?clamp(parseInt(q[1],10),1,NODES):0;
      if(lv){ Save.data.cur=Math.max(Save.data.cur,lv); start(lv); }
      else openMap();
      requestAnimationFrame(loop);
    },
    map:openMap, start:start,
    cur:function(){ return level; },
    session:session,
    missTopics:function(){ return missTopics; },
    missedWords:function(){ return missed; },
    /* только для автотеста (flappy_english.play.js): проиграть партию скриптом
       без доступа к птице и ближайшей стене невозможно */
    peek:function(){ return {state:state,y:bird?bird.y:0,upC:upC,lowC:lowC,
                             ok:ok,lives:lives,goal:cfg?cfg.goal:0,obs:obs}; },
    pause:function(){ if(state==='play'){ state='ready'; } }
  };
})();

/* ═════════════ 6. РАЗБОР ОШИБОК ═════════════
   Каждые 5 тапсырм — только те слова, на которых ребёнок реально промахнулся
   в этой сессии. Отвлекающие — из той же смысловой группы (тот же принцип
   антиугадайки, что и в проёмах). */
function drillQuestions(missed,seed){
  if(!missed||!missed.length) return [];
  var rnd=AK.rng(seed||1), out=[], seen={};
  var uniq=missed.filter(function(w){ if(seen[w.en])return false; seen[w.en]=1; return true; });
  AK.shuffle(uniq,rnd).slice(0,3).forEach(function(w){
    var same=WORDS.filter(function(x){ return x.g===w.g&&x.kk!==w.kk; });
    var pool=(same.length>=2?same:WORDS.filter(function(x){ return x.kk!==w.kk; }));
    var wrong=AK.shuffle(pool.slice(),rnd).slice(0,2).map(function(x){ return x.kk; });
    out.push({ topic:'СӨЗ', text:w.en, answer:w.kk,
               opts:AK.shuffle([w.kk].concat(wrong),rnd) });
  });
  return out;
}

/* ═════════════ 7. UI + мост StudyLine ═════════════ */
(function(){
  function $(id){ return document.getElementById(id); }
  var wrap=$('wrap');

  SL.init({ game:'flappy_english' });

  var Map=AK.map({
    host:wrap, save:Save, nodes:NODES,
    title:'🐤 Ағылшын аренасы',
    subtitle:'Ағылшын тілі · 1-биом',
    onPick:function(n){ Sound.unlock(); Sound.click(); Game.start(n); },
    onLocked:function(){ Sound.nope(); }
  });
  var Drill=AK.drill({
    host:wrap, ask:'Аудармасы қайсы?', slow:'Асықпа, тағы ойлан',
    hint:'Жаңылған сөздерді бекітеміз',
    onAnswer:function(q,ok){
      if(ok) Sound.correct(); else Sound.nope();
      try{ SL.progress({type:'drill',topic:'vocab',word:q.text,correct:ok}); }catch(e){}
    }
  });

  $('muteBtn').addEventListener('click',function(){
    var on=Sound.toggle(); this.textContent=on?'🔊':'🔇';
  });
  $('backBtn').addEventListener('click',function(){
    Sound.click();
    ['sWin','sLose','sBiome'].forEach(function(id){ $(id).classList.remove('on'); });
    Game.map();
  });
  $('againBtn').addEventListener('click',function(){
    Sound.click(); $('sWin').classList.remove('on'); Game.start(Game.cur());
  });
  $('retryBtn').addEventListener('click',function(){
    Sound.click(); $('sLose').classList.remove('on'); Game.start(Game.cur());
  });
  $('mapBtn2').addEventListener('click',function(){
    Sound.click(); $('sLose').classList.remove('on'); Game.map();
  });
  $('nextBtn').addEventListener('click',function(){
    Sound.click(); $('sWin').classList.remove('on');
    var done=Game.cur(), n=done+1;
    if(done%5===0){
      var qs=drillQuestions(Game.missedWords(),done*31+7);
      if(Drill.open(qs,function(){ afterNext(n); })) return;
    }
    afterNext(n);
  });
  function afterNext(n){
    if(n>NODES){
      $('bStars').textContent=Save.total();
      $('sBiome').classList.add('on');
      Sound.unlock2();
      return;
    }
    Game.start(n);
  }
  $('biomeBtn').addEventListener('click',function(){
    Sound.click(); $('sBiome').classList.remove('on'); Game.map();
  });

  var t0=Date.now(), sent=false;
  function sendSession(){
    if(sent) return; sent=true;
    var s=Game.session;
    try{
      SL.finish({
        score:       s.stars*50+s.ok*10,
        correct:     s.ok,
        mistakes:    s.miss,
        maxCombo:    s.stars,
        durationSec: Math.round((Date.now()-t0)/1000),
        difficulty:  'medium',
        details:     { arena:'english', game:'flappy_english', nodes:s.nodes, stars:s.stars,
                       progress:Save.data.cur-1, biome:1,
                       daysThisWeek:Save.daysThisWeek(), errorTopics:Game.missTopics() }
      });
    }catch(e){}
  }

  if(SL.isInApp){
    var c=$('slCloseBtn');
    c.style.display='block';
    c.addEventListener('click',function(){ Sound.click(); sendSession(); SL.close(); });
  }
  SL.on('pause',function(){ try{ Game.pause(); }catch(e){} });
  window.addEventListener('pagehide',sendSession);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) sendSession(); });

  Game.boot(Map,Drill);
  SL.ready();
})();
</script>
</body>
</html>
