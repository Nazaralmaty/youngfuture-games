<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Наизусть">
<meta name="theme-color" content="#FBF7F0">
<title>Наизусть</title>
<style>
:root{
  --bg:#FBF7F0; --card:#FFFDF9; --ink:#26211C; --mut:#8E8478;
  --acc:#C2603F; --acc-soft:#F5E4DC; --sage:#6E7F62; --sage-soft:#E7EBE2;
  --line:#EAE1D4; --shadow:0 1px 2px rgba(38,33,28,.04), 0 8px 24px rgba(38,33,28,.06);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; padding-bottom:env(safe-area-inset-bottom);
  background-image:radial-gradient(rgba(38,33,28,.035) 1px, transparent 1px);
  background-size:22px 22px;
}
#app{max-width:520px;margin:0 auto;padding:0 18px 56px}

/* --- шапка --- */
header{display:flex;align-items:center;justify-content:space-between;padding:26px 2px 18px}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mut);margin-top:3px}
.who{width:38px;height:38px;border-radius:50%;background:var(--acc-soft);color:var(--acc);
  display:grid;place-items:center;font-weight:600;font-size:15px;border:none;cursor:pointer;
  font-family:var(--serif)}

/* --- статистика --- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.stat b{display:block;font-family:var(--serif);font-size:27px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--mut);letter-spacing:.03em}

/* --- вкладки --- */
nav{display:flex;gap:6px;background:#F2EBDF;border-radius:14px;padding:4px;margin-bottom:20px}
nav button{flex:1;border:none;background:none;padding:9px 0;border-radius:11px;font:inherit;
  font-size:14px;color:var(--mut);cursor:pointer}
nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(38,33,28,.08)}

/* --- карточки --- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;
  box-shadow:var(--shadow);margin-bottom:14px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut);margin-bottom:12px}
.tag.deep{color:var(--sage);background:var(--sage-soft);padding:4px 9px;border-radius:20px}
.q{font-family:var(--serif);font-size:25px;line-height:1.28;margin:0 0 20px}

label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 7px 2px}
textarea{width:100%;border:1px solid var(--line);background:#FFF;border-radius:14px;
  padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);resize:none;min-height:58px;
  outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--acc)}
.field{margin-bottom:16px}

button.go{width:100%;border:none;background:var(--acc);color:#fff;font:inherit;font-size:16px;
  font-weight:500;padding:15px;border-radius:15px;cursor:pointer;transition:opacity .15s}
button.go:disabled{opacity:.4}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink)}

/* --- ожидание --- */
.wait{text-align:center;padding:34px 18px}
.wait .ring{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
  border:2px dashed var(--line);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wait p{margin:0;color:var(--mut);font-size:14.5px}
.wait b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px;font-weight:400}

/* --- вскрытие --- */
.pair{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.pair:first-of-type{border-top:none;padding-top:0;margin-top:0}
.line{margin-bottom:10px}
.line span{font-size:11.5px;color:var(--mut);display:block;margin-bottom:2px}
.line p{margin:0;font-family:var(--serif);font-size:17.5px;line-height:1.35}
.verdict{display:flex;gap:8px;margin-top:12px}
.verdict button{flex:1;padding:11px;border-radius:13px;border:1px solid var(--line);
  background:#fff;font:inherit;font-size:14.5px;cursor:pointer}
.verdict button.yes{border-color:var(--sage);color:var(--sage)}
.verdict button.no{color:var(--mut)}
.mark{font-size:12.5px;padding:5px 11px;border-radius:20px;display:inline-block;margin-top:10px}
.mark.hit{background:var(--sage-soft);color:var(--sage)}
.mark.miss{background:#F2EBDF;color:var(--mut)}
.mark.pending{background:var(--acc-soft);color:var(--acc)}

/* --- полка --- */
.shelf{display:flex;flex-direction:column;gap:10px}
.shelf .card{padding:17px 19px;margin:0;cursor:pointer}
.shelf .card .q{font-size:18px;margin:0}
.shelf .card .meta{font-size:11.5px;color:var(--mut);margin-top:7px}
.shelf details summary{list-style:none;cursor:pointer}
.shelf details summary::-webkit-details-marker{display:none}

.empty{text-align:center;color:var(--mut);font-size:14.5px;padding:44px 20px}
.empty b{display:block;font-family:var(--serif);font-size:19px;color:var(--ink);
  font-weight:400;margin-bottom:7px}

/* --- выбор игрока --- */
.picker{padding:70px 0}
.picker h1{font-family:var(--serif);font-size:32px;font-weight:400;margin:0 0 8px}
.picker p{color:var(--mut);margin:0 0 28px;font-size:15px}
.picker button{width:100%;padding:18px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);font-family:var(--serif);font-size:20px;margin-bottom:11px;cursor:pointer}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="questions.js"></script>
<script>
'use strict';

/* ─────────── настройки ─────────── */
var SB   = 'https://ckayydaqncvnbecjlltf.supabase.co/rest/v1/naizust';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrYXl5ZGFxbmN2bmJlY2psbHRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2ODE1MjUsImV4cCI6MjA3NTI1NzUyNX0.o_7QJTdpkl14axm8vDfVH7NahbTvJreHAuI62dYG6U8';
var NAMES = { e: 'Елжан', d: 'Диана' };
var DAILY_LIMIT = 3;              // вопрос дня + возможность добить ещё пару
var Q = window.NZ_QUESTIONS;
var isDeep = function (i) { return i % 10 === 9; };

/* ─────────── состояние ─────────── */
var me = null, rows = [], tab = 'today', busy = false;

/* ─────────── чистая логика (проверяется в selfTest) ─────────── */

// день в локальном часовом поясе: 'YYYY-MM-DD'
function dayKey(ts) {
  var d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

// дни подряд, считая назад от сегодня; вчерашний день ещё держит серию
function streakOf(days, today) {
  var set = {}, i;
  for (i = 0; i < days.length; i++) set[days[i]] = 1;
  var cur = new Date(today + 'T12:00:00');
  if (!set[dayKey(cur)]) cur.setDate(cur.getDate() - 1);   // сегодня ещё не играли — смотрим со вчера
  var n = 0;
  while (set[dayKey(cur)]) { n++; cur.setDate(cur.getDate() - 1); }
  return n;
}

// первый вопрос, на который Я ещё не отвечал
function nextQid(rs, who, total) {
  var mine = {}, i;
  for (i = 0; i < rs.length; i++) if (rs[i].player === who) mine[rs[i].q_id] = 1;
  for (i = 0; i < total; i++) if (!mine[i]) return i;
  return -1;
}

function answeredToday(rs, who, today) {
  return rs.filter(function (r) { return r.player === who && dayKey(r.created_at) === today; }).length;
}

/* ─────────── доступ к данным ─────────── */
function api(path, opts) {
  opts = opts || {};
  opts.headers = {
    apikey: KEY, Authorization: 'Bearer ' + KEY,
    'Content-Type': 'application/json', Prefer: 'return=representation'
  };
  return fetch(SB + path, opts).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t); });
    return r.status === 204 ? null : r.json();
  });
}

function load() {
  return api('?select=*&order=q_id.asc').then(function (d) { rows = d || []; });
}

/* ─────────── выборки ─────────── */
var other = function () { return me === 'e' ? 'd' : 'e'; };
var rowOf = function (q, who) {
  return rows.filter(function (r) { return r.q_id === q && r.player === who; })[0] || null;
};
var doneQids = function () {
  var out = [], i;
  for (i = 0; i < Q.length; i++) if (rowOf(i, 'e') && rowOf(i, 'd')) out.push(i);
  return out;
};

/* ─────────── отрисовка ─────────── */
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(function () { t.classList.remove('on'); }, 2200);
}

function render() {
  var app = document.getElementById('app');
  if (!me) { app.innerHTML = pickerHtml(); return; }

  var done = doneQids();
  var hits = rows.filter(function (r) { return r.verdict === true; }).length;
  var days = done.map(function (q) {
    return dayKey(Math.max(+new Date(rowOf(q, 'e').created_at), +new Date(rowOf(q, 'd').created_at)));
  });

  app.innerHTML =
    '<header><div class="brand">Наизусть<small>' + NAMES.e + ' &amp; ' + NAMES.d + '</small></div>' +
      '<button class="who" id="switch">' + NAMES[me][0] + '</button></header>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + hits + '</b><span>раз угадали друг друга</span></div>' +
      '<div class="stat"><b>' + streakOf(days, dayKey(Date.now())) + '</b><span>дней подряд</span></div>' +
    '</div>' +
    '<nav><button data-tab="today" class="' + (tab === 'today' ? 'on' : '') + '">Сегодня</button>' +
      '<button data-tab="shelf" class="' + (tab === 'shelf' ? 'on' : '') + '">Полка · ' + done.length + '</button></nav>' +
    (tab === 'today' ? todayHtml(done) : shelfHtml(done));
}

function pickerHtml() {
  return '<div class="picker"><h1>Наизусть</h1>' +
    '<p>Игра на двоих. Кто ты?</p>' +
    '<button data-me="e">' + NAMES.e + '</button>' +
    '<button data-me="d">' + NAMES.d + '</button></div>';
}

function todayHtml(done) {
  var html = '';

  // 1. раунды, где оба ответили, но я ещё не сказал, попала ли её догадка
  var pend = done.filter(function (q) { return rowOf(q, me).verdict === null; });
  pend.forEach(function (q) { html += revealHtml(q, true); });

  // 2. текущий вопрос
  var qid = nextQid(rows, me, Q.length);
  var used = answeredToday(rows, me, dayKey(Date.now()));

  if (qid === -1) {
    html += '<div class="card empty"><b>Вопросы кончились</b>Все ' + Q.length +
      ' сыграны. Скажи Клоду — дольёт ещё сотню.</div>';
  } else if (used >= DAILY_LIMIT) {
    html += '<div class="card wait"><div class="ring"></div>' +
      '<b>На сегодня хватит</b><p>Три вопроса за день — это уже много.<br>Возвращайся завтра.</p></div>';
  } else {
    html += '<div class="card">' +
      '<div class="tag' + (isDeep(qid) ? ' deep' : '') + '">' +
        (isDeep(qid) ? 'глубокий вопрос' : 'вопрос ' + (qid + 1)) + '</div>' +
      '<p class="q">' + esc(Q[qid]) + '</p>' +
      '<div class="field"><label>Мой ответ</label>' +
        '<textarea id="a-self" rows="2" placeholder="как есть, своими словами"></textarea></div>' +
      '<div class="field"><label>А что ответит ' + NAMES[other()] + '?</label>' +
        '<textarea id="a-guess" rows="2" placeholder="твоя догадка"></textarea></div>' +
      '<button class="go" id="send" data-q="' + qid + '">Отправить</button></div>';
  }

  // 3. что уже ждёт партнёра
  var waiting = [];
  for (var i = 0; i < Q.length; i++) if (rowOf(i, me) && !rowOf(i, other())) waiting.push(i);
  if (waiting.length) {
    html += '<div class="card wait"><div class="ring"></div><b>Ждём ' +
      (me === 'e' ? 'Диану' : 'Елжана') + '</b><p>' + waiting.length +
      (waiting.length === 1 ? ' вопрос закрыт с твоей стороны' : ' вопроса закрыто с твоей стороны') +
      '.<br>Откроется, когда ответит вторая сторона.</p></div>';
  }
  return html;
}

// карточка вскрытия. needVerdict — показывать ли кнопки «попала / мимо»
function revealHtml(q, needVerdict) {
  var mine = rowOf(q, me), their = rowOf(q, other()), name = NAMES[other()];
  var m = mine.verdict, t = their.verdict;
  return '<div class="card">' +
    '<div class="tag' + (isDeep(q) ? ' deep' : '') + '">' +
      (isDeep(q) ? 'глубокий вопрос' : 'вопрос ' + (q + 1)) + '</div>' +
    '<p class="q">' + esc(Q[q]) + '</p>' +

    '<div class="pair">' +
      '<div class="line"><span>' + name + ' ответила о себе</span><p>' + esc(their.self_answer) + '</p></div>' +
      '<div class="line"><span>ты думал</span><p>' + esc(mine.guess) + '</p></div>' +
      (t === null ? '<div class="mark pending">' + name + ' ещё не сказала, попал ли ты</div>'
                  : '<div class="mark ' + (t ? 'hit' : 'miss') + '">' + (t ? 'попал' : 'мимо') + '</div>') +
    '</div>' +

    '<div class="pair">' +
      '<div class="line"><span>ты ответил о себе</span><p>' + esc(mine.self_answer) + '</p></div>' +
      '<div class="line"><span>' + name + ' думала</span><p>' + esc(their.guess) + '</p></div>' +
      (m === null && needVerdict
        ? '<div class="verdict"><button class="yes" data-v="1" data-id="' + mine.id + '">Попала</button>' +
          '<button class="no" data-v="0" data-id="' + mine.id + '">Мимо</button></div>'
        : '<div class="mark ' + (m ? 'hit' : 'miss') + '">' + (m ? 'попала' : 'мимо') + '</div>') +
    '</div></div>';
}

function shelfHtml(done) {
  if (!done.length) {
    return '<div class="card empty"><b>Полка пока пустая</b>' +
      'Каждый закрытый вопрос останется здесь навсегда.</div>';
  }
  return '<div class="shelf">' + done.slice().reverse().map(function (q) {
    return '<details class="card"><summary><p class="q">' + esc(Q[q]) + '</p>' +
      '<div class="meta">' + NAMES.e + ': ' + esc(rowOf(q, 'e').self_answer) + '</div></summary>' +
      '<div class="pair" style="margin-top:14px">' +
        '<div class="line"><span>' + NAMES.e + '</span><p>' + esc(rowOf(q, 'e').self_answer) + '</p></div>' +
        '<div class="line"><span>' + NAMES.d + ' думала</span><p>' + esc(rowOf(q, 'd').guess) + '</p></div></div>' +
      '<div class="pair">' +
        '<div class="line"><span>' + NAMES.d + '</span><p>' + esc(rowOf(q, 'd').self_answer) + '</p></div>' +
        '<div class="line"><span>' + NAMES.e + ' думал</span><p>' + esc(rowOf(q, 'e').guess) + '</p></div></div>' +
      '</details>';
  }).join('') + '</div>';
}

/* ─────────── события ─────────── */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('button');
  if (!el || busy) return;

  if (el.dataset.me) { setMe(el.dataset.me); return; }
  if (el.id === 'switch') { localStorage.removeItem('nz_me'); me = null; render(); return; }
  if (el.dataset.tab) { tab = el.dataset.tab; render(); return; }

  if (el.id === 'send') {
    var self = document.getElementById('a-self').value.trim();
    var guess = document.getElementById('a-guess').value.trim();
    if (!self || !guess) { toast('Заполни оба поля'); return; }
    submit(+el.dataset.q, self, guess, el);
    return;
  }

  if (el.dataset.v) {
    setVerdict(el.dataset.id, el.dataset.v === '1', el);
  }
});

function setMe(who) {
  me = who; localStorage.setItem('nz_me', who);
  history.replaceState(null, '', '?p=' + who);
  render();
}

function submit(qid, self, guess, btn) {
  busy = true; btn.disabled = true; btn.textContent = 'Отправляю…';
  api('', { method: 'POST', body: JSON.stringify({ q_id: qid, player: me, self_answer: self, guess: guess }) })
    .then(load)
    .then(function () { busy = false; render(); toast('Готово'); })
    .catch(function (e) {
      busy = false; btn.disabled = false; btn.textContent = 'Отправить';
      toast('Не отправилось, проверь интернет');
      console.error(e);
    });
}

function setVerdict(id, val, btn) {
  busy = true; btn.disabled = true;
  api('?id=eq.' + id, { method: 'PATCH', body: JSON.stringify({ verdict: val }) })
    .then(load)
    .then(function () { busy = false; render(); })
    .catch(function (e) { busy = false; btn.disabled = false; toast('Не сохранилось'); console.error(e); });
}

/* ─────────── самопроверка: ?test=1 ─────────── */
function selfTest() {
  var out = [], ok = 0, fail = 0;
  function is(name, a, b) {
    var good = JSON.stringify(a) === JSON.stringify(b);
    good ? ok++ : fail++;
    out.push((good ? '✅ ' : '❌ ') + name + (good ? '' : ' → ' + JSON.stringify(a) + ' ≠ ' + JSON.stringify(b)));
  }
  is('streak: пусто', streakOf([], '2026-08-20'), 0);
  is('streak: только сегодня', streakOf(['2026-08-20'], '2026-08-20'), 1);
  is('streak: только вчера (серия жива)', streakOf(['2026-08-19'], '2026-08-20'), 1);
  is('streak: три подряд', streakOf(['2026-08-18', '2026-08-19', '2026-08-20'], '2026-08-20'), 3);
  is('streak: дырка обрывает', streakOf(['2026-08-17', '2026-08-20'], '2026-08-20'), 1);
  is('streak: позавчера — серия мертва', streakOf(['2026-08-18'], '2026-08-20'), 0);
  is('streak: дубли дней', streakOf(['2026-08-20', '2026-08-20', '2026-08-19'], '2026-08-20'), 2);

  var rs = [{ q_id: 0, player: 'e' }, { q_id: 0, player: 'd' }, { q_id: 1, player: 'd' }];
  is('nextQid: мой первый непройденный', nextQid(rs, 'e', 100), 1);
  is('nextQid: у партнёра свой счёт', nextQid(rs, 'd', 100), 2);
  is('nextQid: банк исчерпан', nextQid([{ q_id: 0, player: 'e' }], 'e', 1), -1);

  var t = dayKey(Date.now());
  is('answeredToday: считает только мои сегодняшние',
    answeredToday([{ player: 'e', created_at: new Date().toISOString() },
                   { player: 'd', created_at: new Date().toISOString() },
                   { player: 'e', created_at: '2020-01-01T10:00:00Z' }], 'e', t), 1);

  is('вопросы: 100 штук', Q.length, 100);
  is('глубокий каждый десятый', [isDeep(0), isDeep(9), isDeep(10), isDeep(99)], [false, true, false, true]);

  document.getElementById('app').innerHTML =
    '<div class="card"><p class="q">Самопроверка</p><pre style="white-space:pre-wrap;font-size:13px">' +
    out.join('\n') + '\n\n' + ok + ' ок, ' + fail + ' провалено</pre></div>';
  console.log(out.join('\n'));
}

/* ─────────── старт ─────────── */
(function () {
  if (new URLSearchParams(location.search).get('test')) { selfTest(); return; }

  var p = new URLSearchParams(location.search).get('p') || localStorage.getItem('nz_me');
  if (p === 'e' || p === 'd') { me = p; localStorage.setItem('nz_me', p); }

  render();
  if (me) load().then(render).catch(function (e) { toast('Нет связи с базой'); console.error(e); });

  // обновляемся при возврате к вкладке — вместо уведомлений
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && me && !busy) load().then(render).catch(function () {});
  });
})();
</script>
</body>
</html>
