<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<title>Вакансии монтажёра — 51</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme: light dark;
  --bg:#fff; --bg2:#F2F2F7; --fill:#E9E9EB; --label:#000; --label2:#6C6C70; --label3:#8E8E93;
  --sep:rgba(60,60,67,.18);
  --blue:#006FF0; --kz:#0A6FB0; --kzbg:#E3F1FA;
  --cis:#0B7A3B; --cisbg:#E5F5EB;
  --far:#B3541E; --farbg:#FDEFE4;
  --hot:#D7341F; --hotbg:#FDE7E3;
  --tg:#0A6FB0; --tgbg:#DFF0FB; --wa:#0B7A3B; --wabg:#DCF5E6;
  --mail:#0062D6; --mailbg:#E1ECFD; --ig:#B3135F; --igbg:#FBE4EF;
  --bar:rgba(255,255,255,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0d10; --bg2:#171a1f; --fill:#23262c; --label:#f2f4f7; --label2:#9aa2ad; --label3:#798089;
    --sep:rgba(84,90,98,.34);
    --blue:#4aa3ff; --kz:#5fbfff; --kzbg:rgba(42,171,238,.16);
    --cis:#4ADE80; --cisbg:rgba(37,211,102,.13);
    --far:#FF8A48; --farbg:rgba(255,138,72,.13);
    --hot:#FF6B57; --hotbg:rgba(255,69,58,.16);
    --tg:#5fbfff; --tgbg:rgba(42,171,238,.15); --wa:#4ADE80; --wabg:rgba(37,211,102,.14);
    --mail:#6AB0FF; --mailbg:rgba(10,132,255,.16); --ig:#FF7DB8; --igbg:rgba(225,48,108,.17);
    --bar:rgba(11,13,16,.86);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--label);font:16px/1.34 var(--font);letter-spacing:-.015em;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
main{max-width:760px;margin:0 auto;padding:0 14px}
header{padding:calc(env(safe-area-inset-top) + 34px) 0 10px}
h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.tally{margin:7px 0 0;color:var(--label2);font-size:14.5px;width:fit-content}
.tally b{color:var(--label);font-weight:600}

.nav{position:sticky;top:0;z-index:5;margin:0 -14px 6px;padding:8px 14px 10px;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border-radius:11px;background:var(--fill)}
.tabs button{min-height:42px;border:0;border-radius:9px;background:none;color:var(--label2);
  font:600 14px var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button[aria-pressed=true]{background:var(--bg2);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs .n{font-size:11.5px;opacity:.75;font-weight:700}
.chips{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;min-height:32px;border:0;border-radius:16px;background:var(--bg2);color:var(--label2);
  font:600 13px var(--font);cursor:pointer}
.chip[aria-pressed=true]{background:var(--label);color:var(--bg)}

.group{margin:26px 0 4px;display:flex;align-items:baseline;gap:10px}
.group h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.group .d{color:var(--label2);font-size:13px}
.group .g{margin-left:auto;font:700 11.5px var(--font);padding:3px 9px;border-radius:11px}
.gkz{background:var(--kzbg);color:var(--kz)} .gcis{background:var(--cisbg);color:var(--cis)} .gfar{background:var(--farbg);color:var(--far)}
.shmak{color:var(--label3)}

.jobs{display:grid;gap:10px;margin:10px 0 30px;
  grid-template-columns:1fr}
@media (min-width:620px){.jobs{grid-template-columns:1fr 1fr}}
.job{position:relative;padding:14px 14px 12px;border-radius:16px;background:var(--bg2);
  border:.5px solid var(--sep);cursor:pointer;display:flex;flex-direction:column;gap:6px;
  transition:transform .12s ease, box-shadow .12s ease}
.job:active{transform:scale(.985)}
@media (hover:hover){.job:hover{box-shadow:0 6px 22px rgba(0,0,0,.13);transform:translateY(-1px)}}
.job .row{display:flex;align-items:center;gap:8px;color:var(--label2);font-size:12px;line-height:16px}
.ago{margin-left:auto;white-space:nowrap}
.bud{font-weight:700;color:var(--label);font-size:13px;white-space:nowrap}
.bud.muted{color:var(--label3);font-weight:500}
.jt{margin:0;font-size:15.5px;line-height:1.3;font-weight:650;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.types{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tt{font:600 10.5px var(--font);padding:3px 7px;border-radius:7px;background:var(--fill);color:var(--label2);letter-spacing:.01em}
.cta{margin-top:2px;font:600 13px var(--font);color:var(--blue);display:flex;align-items:center;gap:5px}
.cv-ic::after{content:"→"}
.shotwrap{margin:2px calc(-14px) -12px;height:118px;border-radius:0 0 16px 16px;overflow:hidden;
  background:var(--bg);opacity:.92}
.shot{width:100%;height:118px;object-fit:cover;object-position:top;display:block;filter:saturate(.92)}
@media (min-width:620px){.shotwrap{height:96px}.shot{height:96px}}

.empty{padding:40px;text-align:center;color:var(--label2);font-size:15px}
footer{padding:8px 0 34px;color:var(--label3);font-size:12px;line-height:1.5}
footer a{color:var(--label2)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,10,13,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .18s}
.ov.on{opacity:1;pointer-events:auto}
.md{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:760px;margin:0 auto;
  background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100% - 6vh);
  transform:translateY(104%);transition:transform .24s cubic-bezier(.32,.72,.32,1);
  display:flex;flex-direction:column;box-shadow:0 -12px 44px rgba(0,0,0,.3)}
.md.on{transform:translateY(0)}
@media (min-width:900px){.md{top:6vh;bottom:auto;max-width:700px;left:50%;transform:translate(-50%,104%)}.md.on{transform:translate(-50%,0)}}
.grab{padding:10px 0 2px;display:grid;place-items:center;flex:0 0 auto}
.grab i{display:block;width:42px;height:4.5px;border-radius:3px;background:var(--label3);opacity:.4}
.mbody{overflow-y:auto;overscroll-behavior:contain;padding:0 16px 20px;flex:1 1 auto}
.mtitle{margin:2px 0 4px;font-size:22px;line-height:1.22;font-weight:800;letter-spacing:-.02em}
.mmeta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--label2);font-size:13px;align-items:center}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.pill{font:600 12px var(--font);padding:5px 10px;border-radius:10px;background:var(--kzbg);color:var(--kz)}
.pill.cis{background:var(--cisbg);color:var(--cis)} .pill.far{background:var(--farbg);color:var(--far)}
.pill.hot{background:var(--hotbg);color:var(--hot)}
.mwhy{color:var(--label2);font-size:12.5px;margin:8px 0 0}

.src-cap{margin:18px 0 8px;color:var(--label2);font:600 11.5px var(--font);letter-spacing:.09em;text-transform:uppercase}
.shotfull{display:block;position:relative;border-radius:14px;overflow:hidden;background:var(--bg2);border:.5px solid var(--sep)}
.shotfull img{width:100%;display:block}
.shotfull .zoom{position:absolute;inset:0;display:block}
.fulltext{margin:10px 0 0;padding:13px;border-radius:14px;background:var(--bg2);border:.5px solid var(--sep);
  font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg{margin:18px 0 0;padding:12px 14px;border-radius:16px 16px 16px 5px;background:var(--blue);color:#fff;
  font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.msg a{color:#eaf3ff;text-decoration:underline}
.mlabel{font:600 11.5px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--label2);margin:0 0 8px}
.acts2{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;display:grid;gap:8px;
  grid-template-columns:repeat(2,1fr);border-top:.5px solid var(--sep);margin-top:14px}
.acts2 .one{grid-column:1/-1}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 14px;
  border:0;border-radius:14px;font:600 14.5px var(--font);cursor:pointer;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.btn2:active{transform:scale(.96)}
.btn2.tg{color:#fff;background:var(--tg);min-height:48px}
.btn2.tg::before{content:"✈"}
.btn2.wa{color:#fff;background:var(--wa);min-height:48px}
.btn2.wa::before{content:"◍"}
.btn2.mail{color:#fff;background:var(--mail)}
.btn2.ig{color:var(--ig);background:var(--igbg)}
.btn2.copy{color:var(--blue);background:var(--bg2)}
.btn2.apply{color:var(--bg);background:var(--label)}
.btn2.ghost{color:var(--label2);background:var(--bg2)}
.x{position:absolute;top:10px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;
  background:var(--fill);color:var(--label2);font-size:16px;cursor:pointer;display:grid;place-items:center}
.srcnote{color:var(--label3);font-size:11.5px;margin:8px 0 0;overflow-wrap:anywhere}
.srcnote a{color:var(--label2)}

.hud{position:fixed;left:50%;top:44%;z-index:30;padding:14px 20px;border-radius:14px;background:rgba(28,30,34,.92);
  color:#fff;font-size:14.5px;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .2s}
.hud.on{opacity:1}
@media (prefers-reduced-motion: reduce){.md,.ov{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Вакансии монтажёра</h1>
    <p class="tally" id="tally"></p>
  </header>
  <nav class="nav" aria-label="Фильтры">
    <div class="tabs" role="group" aria-label="Гео">
      <button type="button" data-geo="" aria-pressed="true">Все <span class="n" id="n-all"></span></button>
      <button type="button" data-geo="kz" aria-pressed="false">🇰🇿 Казахстан <span class="n" id="n-kz"></span></button>
      <button type="button" data-geo="other" aria-pressed="false">СНГ и мир <span class="n" id="n-rest"></span></button>
    </div>
    <div class="chips" role="group" aria-label="Тип работ">
      <button type="button" class="chip" data-type="" aria-pressed="true">Все типы</button>
      <button type="button" class="chip" data-type="reels">Reels / Shorts</button>
      <button type="button" class="chip" data-type="podcast">Подкасты</button>
      <button type="button" class="chip" data-type="motion">Моушн</button>
      <button type="button" class="chip" data-type="ads">Реклама</button>
      <button type="button" class="chip" data-type="ai">ИИ-видео</button>
      <button type="button" class="chip" data-type="youtube">YouTube</button>
    </div>
  </nav>
  <div id="groups"></div>
  <footer id="foot"></footer>
</main>

<div class="ov" id="ov"></div>
<aside class="md" id="md" role="dialog" aria-modal="true" aria-labelledby="mdt">
  <div class="grab"><i></i></div>
  <div class="mbody" id="mbody"></div>
</aside>
<div class="hud" id="hud" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
'use strict';
const JOBS = Array.isArray(window.VAK) ? window.VAK : [], REELS = window.REELS || {};
const TYPE = { reels: 'Reels / Shorts', podcast: 'Подкасты', motion: 'Моушн', ads: 'Реклама', ai: 'ИИ-видео', youtube: 'YouTube' };
const GEO = {
  kz: { name: 'Казахстан', mark: '🇰🇿', d: 'Алматы, Астана и офисы по стране', cls: 'kz' },
  cis: { name: 'СНГ · удалённо', mark: '🌍', d: 'Русскоязычные удалённые из РФ, UA, BY', cls: 'cis' },
  other: { name: 'Зарубежные', mark: '🛰', d: 'Reddit, Freelancer, международные борды — английский', cls: 'far' },
};
const ORDER = ['kz', 'cis', 'other'];
const LANG = { ru: 'рус.', kk: 'каз.', en: 'англ.' };
const SIGN = { ru: 'Елжан', kk: 'Елжан', en: 'Elzhan' };
const SUBJ = { ru: t => `Отклик на вакансию «${t}»`, kk: t => `«${t}» вакансиясы бойынша`, en: t => `Re: ${t}` };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reel = j => j.reel || REELS[['podcast', ...j.types].find(t => j.types.includes(t) && REELS[t])] || REELS.default || '';
const body = j => j.reply.replace('{reel}', reel(j)) + '\n\n' + (SIGN[j.lang] || SIGN.ru);
const money = b => b ? `${Number(b[0]).toLocaleString('ru-RU')} ${b[1]}${({ video: ' / ролик', month: ' / мес', hour: ' / час', project: ' / шт' }[b[2]] || '')}` : '';
function ago(iso) {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? 'сейчас' : h < 24 ? Math.round(h) + ' ч' : h < 48 ? '1 д' : h < 24 * 12 ? Math.round(h / 24) + ' д' : new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}
const pretty = u => u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '').slice(0, 52);
function route(j, c) {
  const t = body(j);
  switch (c.type) {
    case 'tg': return { href: 'https://t.me/' + c.value, label: 'Telegram', copy: true };
    case 'wa': return { href: 'https://wa.me/' + c.value + '?text=' + encodeURIComponent(t), label: 'WhatsApp', copy: false };
    case 'email': return { href: 'mailto:' + c.value + '?subject=' + encodeURIComponent((SUBJ[j.lang] || SUBJ.ru)(j.title)) + '&body=' + encodeURIComponent(t), label: 'На почту', self: true };
    case 'ig': return { href: 'https://ig.me/m/' + c.value, label: 'Instagram', copy: true };
    case 'reddit': return { href: 'https://www.reddit.com/message/compose/?to=' + encodeURIComponent(c.value) + '&subject=' + encodeURIComponent(j.title.slice(0, 80)) + '&message=' + encodeURIComponent(t), label: 'Reddit ЛС', copy: false };
    case 'apply': return { href: c.value, label: 'Отклик через сайт', copy: true };
    default: return { href: j.url, label: 'Первоисточник', copy: true };
  }
}
let shot = j => { const f = j.id + '.jpg'; return SHOTS.has(f); };

function card(j) {
  const geo = GEO[j.geo];
  const bud = j.budget ? money(j.budget) : 'без бюджета';
  return `<a class="job" href="#" data-j="${j.id}" role="button" aria-haspopup="dialog">
    <div class="row"><span>${geo.mark} ${esc(j.city || '')}</span><span class="bud${j.budget ? '' : ' muted'}">${esc(bud)}</span><span class="ago">${esc(ago(j.posted))}</span></div>
    <h3 class="jt">${esc(j.title)}</h3>
    <div class="types">${j.types.slice(0, 3).map(t => `<span class="tt">${esc(TYPE[t] || t)}</span>`).join('')}${j.remote ? '<span class="tt">удалённо</span>' : ''}</div>
    ${shot(j) ? `<div class="shotwrap"><img class="shot" loading="lazy" alt="" src="shots/${j.id}.jpg"></div>`
              : `<div class="cta cv-ic">Открыть первоисточник</div>`}
  </a>`;
}

const state = { geo: '', type: '' };
const SHOTS = new Set();
let shown = [];
function render() {
  shown = JOBS.filter(j => (!state.geo || (state.geo === 'rest' ? j.geo !== 'kz' : j.geo === 'kz')) && (!state.type || j.types.includes(state.type)))
               .sort((a, b) => (b.posted || '').localeCompare(a.posted || '') || b.score - a.score);
  const gc = document.getElementById('groups');
  let html = '';
  for (const g of ORDER) {
    if (state.geo === 'kz' && g !== 'kz') continue;
    const list = shown.filter(j => j.geo === g);
    if (!list.length) continue;
    html += `<section id="g-${g}"><div class="group"><h2>${GEO[g].mark} ${GEO[g].name}</h2>
      <span class="g g${GEO[g].cls}">${list.length}</span></div><p class="d">${GEO[g].d}</p>
      <div class="jobs">${list.map(card).join('')}</div></section>`;
  }
  gc.innerHTML = html || '<p class="empty">Под фильтр ничего нет.</p>';
}
function fillCounts() {
  let kz = 0;
  for (const j of JOBS) kz += j.geo === 'kz' ? 1 : 0;
  document.getElementById('n-all').textContent = JOBS.length;
  document.getElementById('n-kz').textContent = kz;
  document.getElementById('n-rest').textContent = JOBS.length - kz;
}

/* ---------- modal ---------- */
const ov = document.getElementById('ov'), md = document.getElementById('md'), mb = document.getElementById('mbody');
let cur = null;
function btn(j, c, cls, extra) {
  const r = route(j, c);
  return `<a class="btn2 ${cls}" href="${esc(r.href)}"${r.self ? '' : ' target="_blank" rel="noopener"'} data-act="${r.copy ? 'copy-go' : 'go'}">${esc(r.label)}${extra || ''}</a>`;
}
function openM(id) {
  const j = JOBS.find(x => x.id === id); if (!j) return;
  cur = j;
  const geo = GEO[j.geo];
  const bud = j.budget ? money(j.budget) : 'бюджет не назван';
  const cc = j.contacts.filter(c => ['tg', 'wa', 'email', 'ig', 'reddit'].includes(c.type));
  const first = cc.length ? btn(j, cc[0], cc[0].type === 'email' ? 'mail' : cc[0].type, ' · текст будет скопирован') : '';
  const rest = cc.slice(1, 3).map(c => btn(j, c, c.type === 'email' ? 'mail' : c.type)).join('');
  const acts = `<div class="acts2">
      ${first}
      ${rest}
      <button class="btn2 ghost" type="button" data-act="copy">Скопировать только текст</button>
      <a class="btn2 apply" href="${esc(j.url)}" target="_blank" rel="noopener" data-act="go">Отклик / apply на источнике</a>
    </div>`;
  const shotHtml = shot(j)
    ? `<a class="shotfull" href="${esc(j.url)}" target="_blank" rel="noopener" title="Открыть пост, нажмите">`
        + `<img src="shots/${j.id}.jpg" loading="lazy" alt="Скриншот поста"></a>`
    : '';
  const textHtml = `<p class="mlabel">Текст вакансии</p><div class="fulltext">${esc(j.brief || 'Текста нет, только заголовок. Открывай первоисточник.')}</div>`;
  const srcs = [...new Set(j.contacts.map(c => c.src))];
  mb.innerHTML = `
    <button class="x" type="button" aria-label="Закрыть" onclick="closeM()">✕</button>
    <h3 class="mtitle" id="mdt">${esc(j.title)}</h3>
    <div class="mmeta"><span class="pill ${geo.cls}">${geo.mark} ${esc(geo.name)}</span>${j.hot ? '<span class="pill hot">Горячая</span>' : ''}<span>${esc(bud)}</span>${j.remote ? '<span>удалённо</span>' : (j.city ? `<span>${esc(j.city)}</span>` : '')}<span>${LANG[j.lang] || ''}</span>
    </div>
    <div class="pills">${j.types.map(t => `<span class="pill">${esc(TYPE[t] || t)}</span>`).join('')}</div>
    <p class="src-cap">Первоисточник</p>
    ${shotHtml}
    ${textHtml}
    <p class="mlabel" style="margin-top:16px">Твоё сообщение</p>
    <div class="msg">${esc(body(j)).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`)}</div>
    ${acts}
    <p class="srcnote">Контакты взяты из самого поста: ${srcs.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(pretty(u))}</a>`).join(' · ')}</p>`;
  ov.classList.add('on'); md.classList.add('on');
  document.body.style.overflow = 'hidden';
  mb.scrollTop = 0;
}
function closeM() {
  ov.classList.remove('on'); md.classList.remove('on'); document.body.style.overflow = '';
  cur = null;
}
ov.onclick = closeM;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });
md.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !cur) return;
  const act = b.dataset.act;
  if (act === 'copy' || act === 'copy-go') { copy(body(cur)); flash(act === 'copy' ? 'Текст скопирован' : 'Скопировано, вставь в чат'); }
  // 'copy-go' | 'go' — ссылка continues to its href
});
const cards = document.getElementById('groups');
cards.addEventListener('click', e => {
  const j = e.target.closest('[data-j]');
  if (!j) return;
  e.preventDefault();
  openM(j.dataset.j);
});

/* hud */
const hud = document.getElementById('hud'); let hudT;
function flash(m) { hud.textContent = m; hud.classList.add('on'); clearTimeout(hudT); hudT = setTimeout(() => hud.classList.remove('on'), 1500); }
function copy(text) {
  const fb = () => { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0;font-size:16px'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(fb); else fb();
}

/* init: preload shots, collect which exist, then render cards */
(function init() {
  const uniq = [...new Set(JOBS.map(j => j.id))];
  let done = 0;
  const one = n => new Promise(res => {
    const im = new Image();
    im.onload = im.onerror = () => { if (im.naturalWidth > 4) SHOTS.add(n + '.jpg'); res(); };
    im.src = 'shots/' + n + '.jpg';
  });
  uniq.forEach(async n => { await one(n); done++; });
  const wait = setInterval(() => {
    if (done >= uniq.length) { clearInterval(wait); render(); }
  }, 250);
  setTimeout(() => { clearInterval(wait); render(); }, 5000); // enough
  render();
})();

const TALLY = `Собрано 25.10 · HeadHunter пропущен · ни одного автоотклика`;
document.getElementById('tally').innerHTML = `<b>${JOBS.length}</b> вакансий · ${TALLY}`;
document.getElementById('foot').textContent = TALLY + '. Кнопка «apply» открывает чат / сайт работодателя; текст вакансии и контакты — прямо в окне.';
fillCounts();
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  state.geo = b.dataset.geo;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  render();
});
document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  state.type = b.dataset.type;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  render();
});
</script>
