<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Тау-Туран — было и стало</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0e0e10; color: #f2f2f2; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #a8a8ad; font-size: 14px; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; justify-items: center; }
  figure { width: 100%; max-width: 420px; }
  @media (min-width: 700px) { .pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  figure { margin: 0; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; display: block; }
</style>
</head>
<body>
<main>
  <h1>Тау-Туран</h1>
  <p>Рилс «интервью у наших вожатых», в ленте @tauturaninfo 27.10.2026</p>
  <div class="pair">
    <figure><figcaption>Стало</figcaption><video src="after.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video></figure>
    <figure><figcaption>Было</figcaption><video src="before.mp4" controls playsinline preload="metadata"></video></figure>
  </div>
</main>
</body>
</html>
