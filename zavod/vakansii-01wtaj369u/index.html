<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Вакансии</title>
<link rel="icon" href="data:,">
<!-- Sister of ../otpravka-bscv6sc3s9/: same iOS tokens. Data: jobs.js, written by _продажа_завода/вакансии/vakansii.py. -->
<style>
:root{
  color-scheme: light dark;
  --bg:#fff; --bg2:#F2F2F7; --fill:#E9E9EB;
  --label:#000; --label2:#6C6C70; --label3:#8E8E93;
  --sep:rgba(60,60,67,.2);
  --blue:#006FF0; --bubble:#006FF0; --hot:#D7341F; --hot-bg:#FDE7E3;
  --wa:#0B7A3B; --wa-bg:#DCF5E6; --mail:#0062D6; --mail-bg:#E1ECFD; --ig:#B3135F; --ig-bg:#FBE4EF;
  --tg:#0A6FB0; --tg-bg:#DFF0FB;
  --bar:rgba(249,249,249,.88);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --bg2:#1C1C1E; --fill:#262628; --label:#fff; --label2:#AEAEB2; --label3:#8E8E93;
    --sep:rgba(84,84,88,.62); --blue:#0A84FF; --hot:#FF6B57; --hot-bg:rgba(255,69,58,.18);
    --wa:#4ADE80; --wa-bg:rgba(37,211,102,.15); --mail:#6AB0FF; --mail-bg:rgba(10,132,255,.17);
    --ig:#FF7DB8; --ig-bg:rgba(225,48,108,.19); --tg:#62C0FF; --tg-bg:rgba(42,171,238,.17);
    --bar:rgba(22,22,24,.88);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.016em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
main{max-width:720px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 40px) 16px 6px}
h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em}
.tally{margin:2px 0 0;color:var(--label2);font-size:15px;line-height:20px}

.bar{position:sticky;top:0;z-index:3;padding:8px 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{min-height:44px;border:0;border-radius:7px;background:none;color:var(--label);font:600 13px var(--font);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.sel select{width:100%;min-height:44px;padding:0 8px;border:0;border-radius:9px;background:var(--bg2);color:var(--label);font:15px var(--font)}

.list{list-style:none;margin:0;padding:0 0 calc(env(safe-area-inset-bottom) + 24px)}
.job{padding:14px 16px 16px;border-bottom:.5px solid var(--sep)}
.job[data-opened] .score::after{content:" · открыт";font-weight:500}
.meta{display:flex;align-items:center;gap:8px;color:var(--label2);font-size:13px;line-height:18px}
.score{white-space:nowrap;padding:2px 8px;border-radius:10px;background:var(--bg2);color:var(--label2);font-weight:700}
.hot .score{background:var(--hot-bg);color:var(--hot)}
.meta time{margin-left:auto;white-space:nowrap}
h2{margin:6px 0 2px;font-size:17px;line-height:22px;font-weight:600;overflow-wrap:anywhere}
.sub{margin:0;color:var(--label2);font-size:15px;line-height:20px}
.sub b{color:var(--label);font-weight:600}
.why{margin:6px 0 0;color:var(--label3);font-size:13px;line-height:18px}
.hot .why{color:var(--hot)}
details{margin-top:8px}
summary{color:var(--blue);font-size:15px;cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
.brief{margin:4px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg2);font-size:15px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}
.bubble{position:relative;margin:10px 10px 0 auto;max-width:92%;width:fit-content;padding:7px 13px 8px;border-radius:18px;background:var(--bubble);color:#fff;font-size:15px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;bottom:0;right:-7px;width:20px;height:20px;background:var(--bubble);border-bottom-left-radius:16px 14px}
.bubble::after{content:"";position:absolute;bottom:0;right:-10px;width:10px;height:20px;background:var(--bg);border-bottom-left-radius:10px}
.bubble a{color:#fff;text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:0;border-radius:22px;font:600 15px var(--font);cursor:pointer;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn:active{transform:scale(.95)}
.tg{color:var(--tg);background:var(--tg-bg)} .wa{color:var(--wa);background:var(--wa-bg)}
.mail{color:var(--mail);background:var(--mail-bg)} .ig{color:var(--ig);background:var(--ig-bg)}
.apply,.reddit,.copy{color:var(--blue);background:var(--bg2)}
.src{margin:6px 0 0;color:var(--label3);font-size:12px;line-height:16px;overflow-wrap:anywhere}
.src a{text-decoration:underline}
.empty{padding:48px 32px;text-align:center;color:var(--label2);font-size:15px}
footer{padding:16px;color:var(--label3);font-size:12px;line-height:16px}
.hud{position:fixed;left:50%;top:42%;z-index:9;padding:16px 22px;border-radius:16px;background:rgba(30,30,32,.88);color:#fff;font-size:15px;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .2s}
.hud.on{opacity:1}
</style>
</head>
<body>
<main>
  <header><h1>Вакансии</h1><p class="tally" id="tally"></p></header>
  <div class="bar">
    <div class="seg" role="group" aria-label="Показать">
      <button type="button" data-hot="0" aria-pressed="true">Все</button>
      <button type="button" data-hot="1" aria-pressed="false">Горячие</button>
    </div>
    <div class="sel">
      <select id="f-src" aria-label="Источник"><option value="">Источник</option></select>
      <select id="f-type" aria-label="Тип"><option value="">Тип</option></select>
      <select id="f-lang" aria-label="Язык"><option value="">Язык</option></select>
    </div>
  </div>
  <ol class="list" id="list"></ol>
  <footer id="foot"></footer>
</main>
<div class="hud" id="hud" role="status" aria-live="polite"></div>
<script>document.write('<script src="jobs.js?' + Date.now() + '"><\/script>')</script>
<script>
const JOBS = Array.isArray(window.JOBS) ? window.JOBS : [], REELS = window.REELS || {}, META = window.META || {};
const STORE = 'zavod-vakansii-opened';
const TYPE = { reels: 'Reels / Shorts', podcast: 'Подкасты', motion: 'Моушн', ads: 'Реклама', ai: 'ИИ-видео', youtube: 'YouTube' };
const LANG = { ru: 'рус.', kk: 'каз.', en: 'англ.' };
const SIGN = { ru: 'Елжан', kk: 'Елжан', en: 'Elzhan' };
const SUBJ = { ru: t => `Отклик на вакансию «${t}»`, kk: t => `«${t}» вакансиясы бойынша`, en: t => `Re: ${t}` };
let opened = {}; try { opened = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) {}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reel = j => j.reel || REELS[(['podcast', ...j.types]).find(t => j.types.includes(t) && REELS[t])] || REELS.default || '';
const body = j => j.reply.replace('{reel}', reel(j)) + '\n\n' + (SIGN[j.lang] || SIGN.ru);
const money = b => b ? `${Number(b[0]).toLocaleString('ru-RU')} ${b[1]}${{ video: ' за ролик', month: ' в мес.', hour: ' в час', project: '' }[b[2]] || ''}` : '';
function ago(iso) {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso)) / 36e5;
  return h < 1 ? 'только что' : h < 24 ? Math.round(h) + ' ч назад' : h < 48 ? 'вчера' : new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}
const pretty = u => u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60);

function route(j, c) {  // href + whether the text goes to the clipboard (the app takes no prefilled text)
  const t = body(j), v = c.value;
  switch (c.type) {
    case 'tg': return { href: 'https://t.me/' + v, label: 'Telegram @' + v, copy: true };
    case 'wa': return { href: 'https://wa.me/' + v + '?text=' + encodeURIComponent(t), label: 'WhatsApp +' + v };
    case 'email': return { href: 'mailto:' + v + '?subject=' + encodeURIComponent((SUBJ[j.lang] || SUBJ.ru)(j.title)) + '&body=' + encodeURIComponent(t), label: 'Почта', self: true };
    case 'ig': return { href: 'https://ig.me/m/' + v, label: 'Instagram @' + v, copy: true };
    case 'reddit': return { href: 'https://www.reddit.com/message/compose/?to=' + encodeURIComponent(v) + '&subject=' + encodeURIComponent(j.title.slice(0, 90)) + '&message=' + encodeURIComponent(t), label: 'Reddit u/' + v };
    default: return { href: v, label: { hh: 'Отклик на hh', kwork: 'Отклик на Kwork', telegram: 'Пост в канале', instagram: 'Пост в Instagram' }[j.src] || 'Отклик на сайте', copy: true };
  }
}

function card(j, i) {
  const btns = j.contacts.map((c, k) => {
    const r = route(j, c);
    return `<a class="btn ${c.type === 'email' ? 'mail' : c.type}" href="${esc(r.href)}"${r.self ? '' : ' target="_blank" rel="noopener"'} data-i="${i}" data-copy="${r.copy ? 1 : 0}" title="${esc(r.copy ? 'Текст скопируется' : 'Текст уже в сообщении')}">${esc(r.label)}</a>`;
  }).join('');
  const srcs = [...new Set(j.contacts.map(c => c.src))];
  const sub = [j.client && `<b>${esc(j.client)}</b>`, j.budget ? esc(money(j.budget)) : 'бюджет не указан', j.remote ? 'удалённо' : (j.city ? esc(j.city) : ''), LANG[j.lang]].filter(Boolean).join(' · ');
  const text = esc(body(j)).replace(esc(reel(j)), `<a href="${esc(reel(j))}" target="_blank" rel="noopener">${esc(reel(j))}</a>`);
  return `<li class="job${j.hot ? ' hot' : ''}" id="${esc(j.id)}"${opened[j.id] ? ' data-opened' : ''}>
    <div class="meta"><span class="score">${j.hot ? 'Горячая ' : ''}${j.score}</span><span>${esc(j.src)}${j.via ? ' ' + esc(j.via) : ''} · ${esc(j.id)}</span><time datetime="${esc(j.posted)}">${esc(ago(j.posted))}</time></div>
    <h2>${esc(j.title)}</h2>
    <p class="sub">${sub}${j.types.length ? ' · ' + j.types.map(t => TYPE[t]).join(', ') : ''}</p>
    <p class="why">${esc(j.why.join(' · '))}</p>
    <details><summary>ТЗ целиком</summary><div class="brief">${esc(j.brief || 'Текста нет, только заголовок. Открой источник.')}</div></details>
    <div class="bubble">${text}</div>
    <div class="acts">${btns}<button class="btn copy" type="button" data-i="${i}" data-copy-only>Скопировать текст</button></div>
    <p class="src">Контакты прочитаны: ${srcs.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(pretty(u))}</a>`).join(', ')}</p>
  </li>`;
}

const state = { hot: false, src: '', type: '', lang: '' };
let shown = [];
function render() {
  shown = JOBS.filter(j => (!state.hot || j.hot) && (!state.src || j.src === state.src) && (!state.type || j.types.includes(state.type)) && (!state.lang || j.lang === state.lang))
    .sort((a, b) => b.hot - a.hot || b.score - a.score || (b.posted || '').localeCompare(a.posted || ''));
  const hot = JOBS.filter(j => j.hot).length;
  document.getElementById('tally').textContent = JOBS.length ? `${JOBS.length} вакансий · горячих ${hot} · сбор ${META.run ? ago(META.run) : '—'}` : '';
  document.getElementById('list').innerHTML = !window.JOBS ? '<li class="empty">Не загрузился jobs.js — он должен лежать рядом со страницей.</li>'
    : shown.length ? shown.map(card).join('') : '<li class="empty">Под эти фильтры ничего нет.</li>';
}
function fill(id, vals, names) {
  document.getElementById(id).insertAdjacentHTML('beforeend', vals.map(v => `<option value="${esc(v)}">${esc(names ? names[v] || v : v)}</option>`).join(''));
}
fill('f-src', [...new Set(JOBS.map(j => j.src))].sort());
fill('f-type', Object.keys(TYPE), TYPE);
fill('f-lang', Object.keys(LANG), { ru: 'Русский', kk: 'Казахский', en: 'Английский' });
for (const [id, k] of [['f-src', 'src'], ['f-type', 'type'], ['f-lang', 'lang']]) document.getElementById(id).onchange = e => { state[k] = e.target.value; render(); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  state.hot = b.dataset.hot === '1';
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
const err = Object.entries(META.errors || {});
document.getElementById('foot').textContent = (META.run ? `Сбор ${new Date(META.run).toLocaleString('ru-RU')}. ` : '') + (err.length ? 'Не ответили: ' + err.map(([k, v]) => `${k} (${v})`).join('; ') : '');

const hud = document.getElementById('hud'); let hudT;
function flash(m) { hud.textContent = m; hud.classList.add('on'); clearTimeout(hudT); hudT = setTimeout(() => hud.classList.remove('on'), 1400); }
function copy(text) {
  const fb = () => { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0;font-size:16px'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(fb); else fb();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-i]');
  if (!b) return;
  const j = shown[+b.dataset.i];
  if (b.dataset.copy === '1' || b.hasAttribute('data-copy-only')) { copy(body(j)); flash(b.hasAttribute('data-copy-only') ? 'Текст скопирован' : 'Текст скопирован — вставь в чат'); }
  if (!b.hasAttribute('data-copy-only')) { opened[j.id] = Date.now(); try { localStorage.setItem(STORE, JSON.stringify(opened)); } catch (e) {} b.closest('.job').setAttribute('data-opened', ''); }
});
render();
</script>
</body>
</html>
